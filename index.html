<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SKKN REVIEW PRO – Trợ lý Chấm & Phản biện Sáng kiến Giáo dục</title>
    <meta name="description" content="Chấm có căn cứ – Phản biện có chiều sâu – Sửa đúng điểm yếu. Trợ lý phân tích, chấm điểm theo rubric, phản biện Red Team, kiểm tra tính mới, minh chứng và dữ liệu cho sáng kiến giáo dục." />
    <meta property="og:title" content="SKKN REVIEW PRO – Trợ lý Chấm & Phản biện Sáng kiến Giáo dục" />
    <meta property="og:description" content="Chấm có căn cứ – Phản biện có chiều sâu – Sửa đúng điểm yếu. Trợ lý phân tích, chấm điểm theo rubric, phản biện Red Team, kiểm tra tính mới, minh chứng và dữ liệu cho sáng kiến giáo dục." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/mascot.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #020617; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding: 20px;">
        <div style="max-width: 420px; width: 100%; text-align: center; background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 32px 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);">
          <div style="width: 48px; height: 48px; border: 3px solid #3b82f6; border-top-color: transparent; border-radius: 50%; margin: 0 auto 20px; animation: skkn-spin 0.8s linear infinite;"></div>
          <h2 style="font-size: 16px; font-weight: 700; color: #ffffff; margin: 0 0 8px 0; letter-spacing: 0.02em;">
            SKKN REVIEW PRO
          </h2>
          <p style="font-size: 13px; color: #94a3b8; margin: 0 0 16px 0; line-height: 1.5;">
            Đang khởi động Trợ lý Chấm & Phản biện Sáng kiến Giáo dục...
          </p>
          <div id="fallback-error-box" style="display: none; margin-top: 16px; padding: 12px; background: #1e1b4b; border: 1px solid #3730a3; border-radius: 10px; font-size: 12px; color: #e0e7ff; text-align: left;">
            <p style="margin: 0 0 6px 0; font-weight: 600; color: #f43f5e;">Đã xảy ra lỗi khởi tạo:</p>
            <p id="fallback-error-text" style="margin: 0; font-family: monospace; word-break: break-all;"></p>
            <button onclick="window.location.reload()" style="margin-top: 10px; width: 100%; padding: 8px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">Tải lại trang</button>
          </div>
        </div>
      </div>
      <style>
        @keyframes skkn-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var box = document.getElementById('fallback-error-box');
        var txt = document.getElementById('fallback-error-text');
        if (box && txt) {
          box.style.display = 'block';
          txt.innerText = e.message || 'Lỗi tải mô-đun hoặc mã script';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
